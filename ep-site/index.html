<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FOR YOU, I WOULD — minj</title>
<meta name="description" content="for you, i would — minj. eight blades. october 23." />

<meta property="og:type" content="website" />
<meta property="og:title" content="FOR YOU, I WOULD — minj" />
<meta property="og:description" content="eight blades. october 23." />
<meta property="og:image" content="assets/img/hero-flag.webp" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sky">
  <div class="sun"></div>
  <div class="haze haze-a"></div>
  <div class="haze haze-b"></div>
</div>
<div class="grain"></div>

<header class="hud hud-top">
  <p class="artist">minj</p>
  <h1 class="ep-title">FOR YOU, I WOULD</h1>
</header>

<button class="sound-toggle" id="soundToggle" aria-pressed="false" title="sound">
  <span class="sound-on">sound on</span>
  <span class="sound-off">sound off</span>
</button>

<main class="arena" id="arena" aria-label="eight sheathed swords"></main>

<footer class="hud hud-bottom">
  <p class="hint" id="hint">draw each blade</p>
  <p class="counter"><span id="drawnCount">0</span> <span class="slash">/</span> 8 drawn</p>
</footer>

<div class="finale-card" id="finaleCard">
  <p class="finale-kicker">one blade has not been sung</p>
  <h2 class="finale-title">FOR YOU, I WOULD</h2>
  <a class="finale-cta" href="/preview">hear it first</a>
  <p class="finale-date">the record — october 23</p>
</div>

<button class="escape-hint" id="escapeHint">sheathe</button>

<script src="script.js"></script>
</body>
</html>
